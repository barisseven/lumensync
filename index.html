<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumen Sync - Katılımcı</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; text-align: center; padding: 40px 20px; margin: 0; }
        .box { max-width: 400px; margin: 0 auto; background: #1e1e1e; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        button { width: 100%; padding: 15px; font-size: 18px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; background: #ff9800; color: #fff; }
        #status { margin-top: 20px; font-size: 15px; color: #aaa; word-break: break-word; }
        #cam { display: none; }
    </style>
</head>
<body>
    <div class="box">
        <h2>✨ Lumen Sync</h2>
        <p>Şovun senkronize olması için butona basın:</p>
        <button onclick="startShow()">Şova Katıl & İzin Ver</button>
        <div id="status">Durum: Bekleniyor...</div>
    </div>

    <video id="cam" autoplay playsinline muted></video>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDntqYxoZXhJZmxtbGaPOF54EEW0F1Co8",
            authDomain: "lumensync-brssvn.firebaseapp.com",
            projectId: "lumensync-brssvn",
            storageBucket: "lumensync-brssvn.firebasestorage.app",
            messagingSenderId: "295249691227",
            appId: "1:295249691227:web:a394942537af7b98f5357e",
            measurementId: "G-K75JNFBH3V"
        };

        const statusEl = document.getElementById('status');

        let app, db;
        try {
            app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            console.log("Firebase başlatıldı.");
        } catch (e) {
            statusEl.innerText = "Firebase Başlatma Hatası: " + e.message;
            statusEl.style.color = "#f44336";
        }

        let videoTrack = null;
        let strobeTimer = null;

        window.startShow = async function() {
            const videoEl = document.getElementById('cam');
            statusEl.innerText = "Kameraya bağlanılıyor...";

            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { exact: "environment" } }
                }).catch(() => {
                    return navigator.mediaDevices.getUserMedia({
                        video: { facingMode: "environment" }
                    });
                });

                videoEl.srcObject = stream;
                await videoEl.play();
                videoTrack = stream.getVideoTracks()[0];

                statusEl.innerText = "Kamera Hazır. Veritabanı dinleniyor...";
                statusEl.style.color = "#4CAF50";
                
                listenDatabase();

            } catch (err) {
                console.error(err);
                statusEl.innerText = "Kamera Hatası: " + err.message;
                statusEl.style.color = "#f44336";
            }
        };

        async function setFlash(status) {
            if (!videoTrack) return;
            try {
                await videoTrack.applyConstraints({
                    advanced: [{ torch: status }]
                });
            } catch (e) {
                console.error("Flaş donanım hatası:", e);
            }
        }

        function listenDatabase() {
            try {
                onSnapshot(doc(db, "show", "command"), (docSnap) => {
                    if (!docSnap.exists()) {
                        statusEl.innerText = "Bağlantı Var ama 'show/command' belgesi bulunamadı!";
                        return;
                    }
                    const data = docSnap.data();
                    statusEl.innerText = "Komut Alındı: " + data.action;

                    clearInterval(strobeTimer);

                    if (data.action === 'ON') {
                        setFlash(true);
                    } else if (data.action === 'OFF') {
                        setFlash(false);
                    } else if (data.action === 'STROBE') {
                        let state = false;
                        strobeTimer = setInterval(() => {
                            state = !state;
                            setFlash(state);
                        }, data.speed || 150);
                    }
                }, (error) => {
                    console.error("Firestore dinleme hatası:", error);
                    statusEl.innerText = "Veritabanı Dinleme Hatası: " + error.message;
                    statusEl.style.color = "#f44336";
                });
            } catch (e) {
                statusEl.innerText = "Bağlantı Kurulamadı: " + e.message;
                statusEl.style.color = "#f44336";
            }
        }
    </script>
</body>
</html>
