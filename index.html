<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlashBeat - Canlı Şov</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; text-align: center; padding: 40px 20px; margin: 0; }
        .box { max-width: 400px; margin: 0 auto; background: #1e1e1e; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        button { width: 100%; padding: 15px; font-size: 18px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; background: #ff9800; color: #fff; }
        #status { margin-top: 20px; font-size: 16px; color: #aaa; }
    </style>
</head>
<body>
    <div class="box">
        <h2>🎵 FlashBeat Katılımcı</h2>
        <p>Şovun başlaması için lütfen kameraya izin verin:</p>
        <button onclick="initCamera()">Şova Katıl & İzin Ver</button>
        <div id="status">Durum: Bekleniyor...</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDntqYxoZXhJZmxtbGaPOF54EEW0F1Co8",
            authDomain: "lumensync-brssvn.firebaseapp.com",
            projectId: "lumensync-brssvn",
            storageBucket: "lumensync-brssvn.firebasestorage.app",
            messagingSenderId: "295249691227",
            appId: "1:295249691227:web:a394942537af7b98f5357e",
            measurementId: "G-K75JNFBH3V"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let videoTrack = null;
        let strobeInterval = null;

        window.initCamera = async function() {
            const statusEl = document.getElementById('status');
            try {
                statusEl.innerText = "Kameraya erişiliyor...";
                
                // Kesinlikle arka kamerayı (environment) zorla
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { exact: "environment" } }
                }).catch(() => {
                    return navigator.mediaDevices.getUserMedia({
                        video: { facingMode: "environment" }
                    });
                });
                
                videoTrack = stream.getVideoTracks()[0];
                
                // Kısa bir gecikme vererek donanımın torch özelliğini algılamasını bekle
                setTimeout(() => {
                    const capabilities = videoTrack.getCapabilities ? videoTrack.getCapabilities() : {};
                    
                    if (capabilities.torch || videoTrack.getSettings().torch !== undefined) {
                        statusEl.innerText = "Bağlantı Başarılı! Şov bekleniyor...";
                        statusEl.style.color = "#4CAF50";
                        listenCommands();
                    } else {
                        statusEl.innerText = "Bağlantı Başarılı (Flaş testi geçildi). Şov bekleniyor...";
                        statusEl.style.color = "#4CAF50";
                        listenCommands();
                    }
                }, 500);

            } catch (err) {
                console.error(err);
                statusEl.innerText = "Hata: Kamera izni reddedildi veya arka kamera bulunamadı.";
                statusEl.style.color = "#f44336";
            }
        };

        async function setTorch(state) {
            if (!videoTrack) return;
            try {
                await videoTrack.applyConstraints({ advanced: [{ torch: state }] });
            } catch (e) { console.error("Flaş hatası:", e); }
        }

        function listenCommands() {
            onSnapshot(doc(db, "show", "command"), (docSnap) => {
                if (!docSnap.exists()) return;
                const data = docSnap.data();

                clearInterval(strobeInterval);

                if (data.action === 'ON') {
                    setTorch(true);
                } else if (data.action === 'OFF') {
                    setTorch(false);
                } else if (data.action === 'STROBE') {
                    let state = false;
                    const speed = data.speed || 150;
                    strobeInterval = setInterval(() => {
                        state = !state;
                        setTorch(state);
                    }, speed);
                }
            });
        }
    </script>
</body>
</html>
