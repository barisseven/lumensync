<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumen Sync - Katılımcı</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; display: flex; justify-content: center; align-items: center; font-family: Arial, sans-serif; overflow: hidden; }
        .welcome-box { text-align: center; color: #fff; padding: 20px; z-index: 10; max-width: 400px; background: #1e1e1e; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        button { width: 100%; padding: 15px; font-size: 18px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; background: #ff9800; color: #fff; }
        #status { margin-top: 15px; font-size: 14px; color: #aaa; word-break: break-word; }
        #flash-screen { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; z-index: 99; display: none; }
        #cam { display: none; }
    </style>
</head>
<body>
    <div class="welcome-box" id="ui-box">
        <h2>✨ Lumen Sync</h2>
        <p>Konser şovu için izin verin:</p>
        <button onclick="startShow()">Şova Katıl & İzin Ver</button>
        <div id="status">Durum: Bekleniyor...</div>
    </div>

    <div id="flash-screen"></div>
    <video id="cam" autoplay playsinline muted></video>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDntqYxoZXhJZmxtbGaPOF54EEW0F1Co8",
            authDomain: "lumensync-brssvn.firebaseapp.com",
            projectId: "lumensync-brssvn",
            storageBucket: "lumensync-brssvn.firebasestorage.app",
            messagingSenderId: "295249691227",
            appId: "1:295249691227:web:a394942537af7b98f5357e",
            measurementId: "G-K75JNFBH3V"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const statusEl = document.getElementById('status');
        const flashScreen = document.getElementById('flash-screen');
        const uiBox = document.getElementById('ui-box');
        
        let videoTrack = null;
        let strobeTimer = null;

        window.startShow = async function() {
            const videoEl = document.getElementById('cam');
            statusEl.innerText = "Kameraya bağlanılıyor...";

            // 1. Önce ekran arayüzünü şov moduna geçir (Ekran flaşı garanti çalışsın)
            uiBox.style.display = 'none';
            flashScreen.style.display = 'block';

            // 2. Kamera ve arka flaş (torch) bağlantısını dene
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { exact: "environment" } }
                }).catch(() => {
                    return navigator.mediaDevices.getUserMedia({
                        video: { facingMode: "environment" }
                    });
                });

                videoEl.srcObject = stream;
                await videoEl.play();
                videoTrack = stream.getVideoTracks()[0];

                statusEl.innerText = "Kamera + Ekran Modu Aktif!";
            } catch (err) {
                console.warn("Kamera/Flaş erişilemedi, sadece ekran flaşı kullanılacak:", err);
            }

            listenDatabase();
        };

        async function setHardwareTorch(status) {
            if (!videoTrack) return;
            try {
                await videoTrack.applyConstraints({
                    advanced: [{ torch: status }]
                });
            } catch (e) {
                // Desteklemeyen cihazlarda sessizce geç
            }
        }

        function triggerEffect(color, isStrobe = false, speed = 150) {
            clearInterval(strobeTimer);

            if (isStrobe) {
                let state = false;
                strobeTimer = setInterval(() => {
                    state = !state;
                    // Hem ekranı hem de donanımsal flaşı birlikte tetikle
                    flashScreen.style.background = state ? "#ffffff" : "#000000";
                    setHardwareTorch(state);
                }, speed);
            } else {
                flashScreen.style.background = color;
                setHardwareTorch(color === "#ffffff");
            }
        }

        function listenDatabase() {
            onSnapshot(doc(db, "show", "command"), (docSnap) => {
                if (!docSnap.exists()) return;
                const data = docSnap.data();

                if (data.action === 'ON') {
                    triggerEffect("#ffffff", false);
                } else if (data.action === 'OFF') {
                    triggerEffect("#000000", false);
                } else if (data.action === 'STROBE') {
                    triggerEffect("#ffffff", true, data.speed || 120);
                }
            });
        }
    </script>
</body>
</html>
