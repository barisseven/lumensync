<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlashBeat - Canlı Şov</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; text-align: center; padding: 40px 20px; margin: 0; }
        .box { max-width: 400px; margin: 0 auto; background: #1e1e1e; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        button { width: 100%; padding: 15px; font-size: 18px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; background: #ff9800; color: #fff; }
        #status { margin-top: 20px; font-size: 16px; color: #aaa; }
    </style>
</head>
<body>
    <div class="box">
        <h2>🎵 FlashBeat Katılımcı</h2>
        <p>Şovun başlaması için lütfen kameraya izin verin:</p>
        <button onclick="initCamera()">Şova Katıl & İzin Ver</button>
        <div id="status">Durum: Bekleniyor...</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

        // Senin Firebase Bilgilerin
        const firebaseConfig = {
            apiKey: "AIzaSyDntqYxoZXhJZmxtbGaPOF54EEW0F1Co8",
            authDomain: "lumensync-brssvn.firebaseapp.com",
            projectId: "lumensync-brssvn",
            storageBucket: "lumensync-brssvn.firebasestorage.app",
            messagingSenderId: "295249691227",
            appId: "1:295249691227:web:a394942537af7b98f5357e",
            measurementId: "G-K75JNFBH3V",
            databaseURL: "https://lumensync-brssvn-default-rtdb.europe-west1.firebasedatabase.app" // Veya projenin Realtime Database URL'si
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let videoTrack = null;
        let strobeInterval = null;

        window.initCamera = async function() {
            const statusEl = document.getElementById('status');
            try {
                statusEl.innerText = "Kameraya erişiliyor...";
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { exact: "environment" } }
                }).catch(() => navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } }));
                
                videoTrack = stream.getVideoTracks()[0];
                const capabilities = videoTrack.getCapabilities();

                if (capabilities && capabilities.torch) {
                    statusEl.innerText = "Bağlantı Başarılı! Şov bekleniyor...";
                    statusEl.style.color = "#4CAF50";
                    listenCommands();
                } else {
                    statusEl.innerText = "Uyarı: Flaş desteklenmiyor.";
                    statusEl.style.color = "#ff9800";
                }
            } catch (err) {
                statusEl.innerText = "Hata: Kamera izni reddedildi.";
                statusEl.style.color = "#f44336";
            }
        };

        async function setTorch(state) {
            if (!videoTrack) return;
            try {
                await videoTrack.applyConstraints({ advanced: [{ torch: state }] });
            } catch (e) { console.error(e); }
        }

        function listenCommands() {
            const commandRef = ref(db, 'show/command');
            onValue(commandRef, (snapshot) => {
                const data = snapshot.val();
                if (!data) return;

                clearInterval(strobeInterval);

                if (data.action === 'ON') {
                    setTorch(true);
                } else if (data.action === 'OFF') {
                    setTorch(false);
                } else if (data.action === 'STROBE') {
                    let state = false;
                    const speed = data.speed || 150;
                    strobeInterval = setInterval(() => {
                        state = !state;
                        setTorch(state);
                    }, speed);
                }
            });
        }
    </script>
</body>
</html>
