<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumen Sync - Katılımcı</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; display: flex; justify-content: center; align-items: center; font-family: Arial, sans-serif; overflow: hidden; }
        .welcome-box { text-align: center; color: #fff; padding: 30px; background: #1e1e1e; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); z-index: 10; max-width: 350px; }
        button { width: 100%; padding: 15px; font-size: 18px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; background: #ff9800; color: #fff; }
        #status { margin-top: 15px; font-size: 14px; color: #aaa; word-break: break-word; }
        
        #flash-screen { 
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000000; z-index: 1; 
            will-change: background, opacity;
        }
    </style>
</head>
<body>
    <div id="flash-screen"></div>

    <div class="welcome-box" id="ui-box">
        <h2>✨ Lumen Sync</h2>
        <p>Konser şovu için hazır mısınız?</p>
        <button onclick="startShow()">Şova Katıl</button>
        <div id="status">Durum: Bekleniyor...</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import { getFirestore, doc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDntqYxoZXhJZmxtbGaPOF54EEW0F1Co8",
            authDomain: "lumensync-brssvn.firebaseapp.com",
            projectId: "lumensync-brssvn",
            storageBucket: "lumensync-brssvn.firebasestorage.app",
            messagingSenderId: "295249691227",
            appId: "1:295249691227:web:a394942537af7b98f5357e",
            measurementId: "G-K75JNFBH3V"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const statusEl = document.getElementById('status');
        const flashScreen = document.getElementById('flash-screen');
        const uiBox = document.getElementById('ui-box');
        
        let strobeTimer = null;
        let pulseTimer = null;
        let activeTrigger = null;
        let heartbeatInterval = null;
        const clientId = 'user_' + Math.random().toString(36).substring(2, 9);

        window.startShow = async function() {
            uiBox.style.display = 'none';
            statusEl.innerText = "Şov Modu Aktif!";

            await updateHeartbeat();
            heartbeatInterval = setInterval(updateHeartbeat, 8000);

            window.addEventListener('beforeunload', () => {
                removeClientData();
            });

            if ('wakeLock' in navigator) {
                try {
                    await navigator.wakeLock.request('screen');
                } catch (err) {}
            }

            listenDatabase();
        };

        async function updateHeartbeat() {
            try {
                await setDoc(doc(db, "clients", clientId), {
                    lastSeen: Date.now()
                });
            } catch (e) {}
        }

        async function removeClientData() {
            try {
                await setDoc(doc(db, "clients", clientId), { lastSeen: 0 });
            } catch (e) {}
        }

        // Önceki tüm efektleri ve zamanlayıcıları kesin olarak temizle (Renk karışmasını önler)
        function clearAllEffects() {
            if (strobeTimer) {
                clearInterval(strobeTimer);
                strobeTimer = null;
            }
            if (pulseTimer) {
                clearInterval(pulseTimer);
                pulseTimer = null;
            }
            flashScreen.style.opacity = 1;
        }

        function executeCommand(data) {
            clearAllEffects();

            const now = Date.now();
            const startTime = data.startTime || now;
            const delay = Math.max(0, startTime - now);
            const color = data.color || "#ffffff";

            setTimeout(() => {
                statusEl.innerText = `Komut: ${data.action}`;

                if (data.action === 'ON') {
                    flashScreen.style.background = color;
                } else if (data.action === 'OFF') {
                    flashScreen.style.background = "#000000";
                } else if (data.action === 'STROBE') {
                    let state = false;
                    flashScreen.style.background = "#000000";
                    strobeTimer = setInterval(() => {
                        state = !state;
                        flashScreen.style.background = state ? color : "#000000";
                    }, data.speed || 120);
                } else if (data.action === 'PULSE') {
                    let opacity = 0;
                    let increasing = true;
                    flashScreen.style.background = color;
                    
                    pulseTimer = setInterval(() => {
                        if (increasing) {
                            opacity += 0.05;
                            if (opacity >= 1) increasing = false;
                        } else {
                            opacity -= 0.05;
                            if (opacity <= 0.1) increasing = true;
                        }
                        flashScreen.style.opacity = opacity;
                    }, 40);
                }
            }, delay);
        }

        function listenDatabase() {
            onSnapshot(doc(db, "show", "command"), (docSnap) => {
                if (!docSnap.exists()) return;
                const data = docSnap.data();

                if (data.triggerId === activeTrigger) return;
                activeTrigger = data.triggerId;

                executeCommand(data);
            });
        }
    </script>
</body>
</html>
